name: Build Tailscale Router IPQ64 Binary

"on":
  workflow_dispatch:
    inputs:
      version:
        description: "Tailscale version, for example v1.98.10. Empty means latest Linux arm64 stable package."
        required: false
        default: ""
      force_rebuild:
        description: "Rebuild even if release already exists"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "00 06 * * *"

permissions: {}

concurrency:
  group: tailscale-router-ipq64-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      replace_existing: ${{ steps.release_check.outputs.replace_existing }}
      should_build: ${{ steps.release_check.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}

    env:
      FORCE_REBUILD: "${{ github.event.inputs.force_rebuild || 'false' }}"
      GH_REPO: "${{ github.repository }}"
      INPUT_VERSION: "${{ github.event.inputs.version || '' }}"

    steps:
      - name: Decide Tailscale Linux arm64 version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          STABLE_URL="https://pkgs.tailscale.com/stable/"

          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION_NUMBER="${INPUT_VERSION#v}"
          else
            STABLE_PAGE="$(
              curl --proto '=https' --tlsv1.2 \
                --retry 5 --retry-all-errors \
                --connect-timeout 15 --max-time 60 \
                -fsSL "$STABLE_URL"
            )"
            VERSION_NUMBER="$(
              printf '%s' "$STABLE_PAGE" \
                | grep -oE 'tailscale_[0-9]+\.[0-9]+\.[0-9]+_arm64\.tgz' \
                | sed -E 's/tailscale_([0-9]+\.[0-9]+\.[0-9]+)_arm64\.tgz/\1/' \
                | sort -Vu \
                | tail -n1
            )"
          fi

          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid stable Tailscale version: $VERSION_NUMBER"
            exit 1
          fi

          PACKAGE_NAME="tailscale_${VERSION_NUMBER}_arm64.tgz"
          PACKAGE_URL="${STABLE_URL}${PACKAGE_NAME}"
          if ! curl --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            -fsSIL "$PACKAGE_URL" >/dev/null; then
            echo "::error::Linux arm64 stable package not found: $PACKAGE_NAME"
            exit 1
          fi

          VERSION="v${VERSION_NUMBER}"
          RELEASE_TAG="router-${VERSION}"
          ARTIFACT_NAME="tailscale-router-ipq64-${VERSION}-arm64"

          {
            echo "version=${VERSION}"
            echo "release_tag=${RELEASE_TAG}"
            echo "artifact_name=${ARTIFACT_NAME}"
          } >> "$GITHUB_OUTPUT"

          echo "Tailscale Linux arm64 package: ${PACKAGE_URL}"
          echo "Release tag: ${RELEASE_TAG}"

      - name: Check whether release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            if [[ "$FORCE_REBUILD" == "true" ]]; then
              echo "Release exists and force_rebuild=true. Continue."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "replace_existing=true" >> "$GITHUB_OUTPUT"
            else
              echo "Release already exists: $RELEASE_TAG. Skip build."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "replace_existing=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release does not exist. Continue."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "replace_existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if already built
        if: steps.release_check.outputs.should_build == 'false'
        shell: bash
        run: echo "No new Linux arm64 version to build."

      - name: Install build tools
        if: steps.release_check.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl file git xz-utils

          UPX_VERSION="5.0.2"
          UPX_ARCHIVE="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          curl --proto '=https' --tlsv1.2 \
            --retry 5 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            -fsSLO "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_ARCHIVE}"
          echo "ddc2654063fe4dc80d95b420788494e4db078ebb01a650692d623b5a9906e61e  ${UPX_ARCHIVE}" \
            | sha256sum -c -
          tar -xJf "$UPX_ARCHIVE"
          sudo install -m 0755 "upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/upx
          upx --version

      - name: Fetch exact Tailscale source tag
        if: steps.release_check.outputs.should_build == 'true'
        id: source
        env:
          TAILSCALE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -e tailscale ]]; then
            echo "::error::Unexpected pre-existing tailscale path"
            exit 1
          fi

          git init --quiet tailscale
          git -C tailscale remote add origin https://github.com/tailscale/tailscale.git
          git -C tailscale fetch --depth=1 origin \
            "refs/tags/${TAILSCALE_VERSION}:refs/tags/${TAILSCALE_VERSION}"
          git -C tailscale checkout --quiet --detach \
            "refs/tags/${TAILSCALE_VERSION}^{commit}"

          SOURCE_SHA="$(git -C tailscale rev-parse HEAD)"
          EXACT_TAG="$(git -C tailscale describe --tags --exact-match HEAD)"

          if [[ "$EXACT_TAG" != "$TAILSCALE_VERSION" ]]; then
            echo "::error::Source tag mismatch: $EXACT_TAG != $TAILSCALE_VERSION"
            exit 1
          fi

          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Tailscale source commit: ${SOURCE_SHA}"

      - name: Set up Go
        if: steps.release_check.outputs.should_build == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tailscale/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: tailscale/go.sum

      - name: Build and verify arm64 combined binary
        if: steps.release_check.outputs.should_build == 'true'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          TAILSCALE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        working-directory: tailscale
        run: |
          set -euo pipefail

          go version
          go mod download
          go mod verify

          eval "$(./build_dist.sh shellvars)"

          TAGS="ts_omit_aws,ts_omit_bird,ts_omit_tap,ts_omit_kube,ts_omit_completion,ts_include_cli,ts_omit_systray,ts_omit_tpm,ts_omit_debugeventbus,ts_omit_syspolicy,ts_omit_capture,ts_omit_ssh,ts_omit_taildrop"

          echo "Build version long: ${VERSION_LONG}"
          echo "Build version short: ${VERSION_SHORT}"
          echo "Build tags: ${TAGS}"

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOARM64=v8.0 \
          go build -trimpath \
            -tags "$TAGS" \
            -ldflags "-X tailscale.com/version.longStamp=${VERSION_LONG} -X tailscale.com/version.shortStamp=${VERSION_SHORT} -w -s" \
            -o tailscale.combined \
            ./cmd/tailscaled

          file tailscale.combined
          test -s tailscale.combined

          BUILD_INFO="$(go version -m tailscale.combined)"
          printf '%s\n' "$BUILD_INFO"

          require_build_info() {
            local expected="$1"
            if ! grep -Fq -- "$expected" <<<"$BUILD_INFO"; then
              echo "::error::Missing Go build metadata: $expected"
              exit 1
            fi
          }

          require_build_info $'\tpath\ttailscale.com/cmd/tailscaled'
          require_build_info $'\tmod\ttailscale.com\t'"${TAILSCALE_VERSION}"$'\t'
          require_build_info $'\tbuild\t-tags='"${TAGS}"
          require_build_info $'\tbuild\tCGO_ENABLED=0'
          require_build_info $'\tbuild\tGOARCH=arm64'
          require_build_info $'\tbuild\tGOOS=linux'
          require_build_info $'\tbuild\tGOARM64=v8.0'
          require_build_info $'\tbuild\tvcs.revision='"${SOURCE_SHA}"
          require_build_info $'\tbuild\tvcs.modified=false'

      - name: Compress and verify release files
        if: steps.release_check.outputs.should_build == 'true'
        shell: bash
        working-directory: tailscale
        run: |
          set -euo pipefail

          upx --ultra-brute tailscale.combined
          upx -t tailscale.combined

          mkdir -p dist
          cp tailscale.combined dist/tailscale.combined

          cd dist
          md5sum tailscale.combined > tailscale.combined.md5
          md5sum -c tailscale.combined.md5

          echo "Release binary SHA-256:"
          sha256sum tailscale.combined

          mapfile -t FILES < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${FILES[*]}" != "tailscale.combined tailscale.combined.md5" ]]; then
            echo "::error::Unexpected release files: ${FILES[*]}"
            exit 1
          fi

          ls -lh

      - name: Upload verified build artifact
        if: steps.release_check.outputs.should_build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            tailscale/dist/tailscale.combined
            tailscale/dist/tailscale.combined.md5
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  release:
    needs: build
    if: needs.build.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    env:
      GH_REPO: "${{ github.repository }}"
      RELEASE_TAG: "${{ needs.build.outputs.release_tag }}"
      TARGET_SHA: "${{ github.sha }}"
      TAILSCALE_VERSION: "${{ needs.build.outputs.version }}"

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Verify downloaded release files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t FILES < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          if [[ "${FILES[*]}" != "tailscale.combined tailscale.combined.md5" ]]; then
            echo "::error::Unexpected downloaded files: ${FILES[*]}"
            exit 1
          fi

          cd dist
          md5sum -c tailscale.combined.md5
          echo "Downloaded binary SHA-256:"
          sha256sum tailscale.combined

      - name: Delete old release when force rebuilding
        if: needs.build.outputs.replace_existing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --repo "$GH_REPO" --yes --cleanup-tag

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$RELEASE_TAG" \
            dist/tailscale.combined \
            dist/tailscale.combined.md5 \
            --repo "$GH_REPO" \
            --target "$TARGET_SHA" \
            --title "$TAILSCALE_VERSION" \
            --notes ""
